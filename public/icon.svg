<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2042"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Stylized Geometric "R" Monogram + AI Sparkle Core -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <!-- Main R Stem -->
    <rect x="70" y="56" width="44" height="272" rx="12" fill="#FFFFFF"/>
    
    <!-- Top Arc of R -->
    <path d="M 70 56 L 190 56 C 248 56 288 88 288 144 C 288 198 248 232 190 232 L 70 232 Z" fill="#FFFFFF"/>
    <!-- Inner cutout for R -->
    <path d="M 114 98 L 184 98 C 218 98 244 116 244 144 C 244 172 218 190 184 190 L 114 190 Z" fill="url(#bgGrad)"/>
    
    <!-- R Diagonal Leg with energetic forward slant -->
    <path d="M 160 216 L 272 328 L 216 328 L 120 230 Z" fill="url(#glowGrad)"/>
    
    <!-- AI Sparkle / Star on top right of the R -->
    <path d="M 288 64 C 288 86 304 102 326 102 C 304 102 288 118 288 140 C 288 118 272 102 250 102 C 272 102 288 86 288 64 Z" fill="url(#accentGrad)"/>
    
    <!-- Subtle secondary mini sparkle -->
    <path d="M 326 150 C 326 160 334 168 344 168 C 334 168 326 176 326 186 C 326 176 318 168 308 168 C 318 168 326 160 326 150 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
